# Practice stack for CI. DB_PASSWORD is a throwaway value set by the workflow.
# It is not a real credential. Never put a real password in this file.
services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8095:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
  app:
    build: ./app
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}
      PGDATABASE: campus_events
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}
      POSTGRES_DB: campus_events
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d campus_events"]
      interval: 2s
      timeout: 2s
      retries: 20
